[project]
name = "stock-watch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chase", email = "chaseham00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "yfinance>=1.7.0",
]

[project.scripts]
stock-watch = "stock_watch:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
